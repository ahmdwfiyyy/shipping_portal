services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Values come from a local ".env" file (see env.example)
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SITE_PASSWORD=${SITE_PASSWORD:-staff123}
    volumes:
      # The rate card MUST exist on your machine first, otherwise Docker creates a folder
      - type: bind
        source: "./backend/DATA EXTRACT Rev1.xlsx"
        target: "/app/DATA EXTRACT Rev1.xlsx"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
